    .sort-opt{padding:9px 14px;font-size:.78rem;font-weight:600;color:var(--text2);border-radius:6px;cursor:pointer;transition:background .1s;white-space:nowrap;display:block;width:100%;text-align:left;border:none;background:none}
    .sort-opt:hover{background:var(--card2);color:var(--text)}
    .sort-opt.active{color:var(--accent);background:rgba(79,140,255,.08)}
    /* ── Inline new-box button */
    .new-box-inline-btn{display:flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s}
    .new-box-inline-btn:hover{opacity:.88;transform:translateY(-1px)}
    /* ══ SEASONAL SECTION ════════════════════════════════════════════ */
    .seasonal-section{margin-bottom:20px}
    .seasonal-event-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
    .seasonal-event-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
    .seasonal-event-emoji{font-size:1.5rem;flex-shrink:0}
    .seasonal-event-info{flex:1}
    .seasonal-event-name{font-weight:800;font-size:.9rem;color:var(--text)}
    .seasonal-event-days{font-size:.72rem;font-weight:600;margin-top:1px}
    .seasonal-boxes{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
    .seasonal-box-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .15s}
    .seasonal-box-chip:hover{border-color:var(--border2);box-shadow:var(--shadow)}
    .seasonal-box-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .seasonal-box-chip-name{font-size:.78rem;font-weight:700;color:var(--text)}
    .seasonal-box-chip-cnt{font-size:.68rem;color:var(--text3)}
    .seasonal-tag-btn{display:flex;align-items:center;gap:4px;background:none;border:1px dashed var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text3);font-size:.75rem;transition:all .15s}
    .seasonal-tag-btn:hover{border-color:var(--accent);color:var(--accent)}
    .seasonal-no-boxes{padding:12px 16px;font-size:.78rem;color:var(--text3);font-style:italic}
    .seasonal-tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:.65rem;font-weight:700;border:1px solid;margin:2px;cursor:pointer;transition:all .15s}
    .seasonal-tag-pill.on{opacity:1}
    .seasonal-tag-pill.off{opacity:.35}
    .seasonal-tag-pill:hover{opacity:1}
    /* ══ GARAGE ZONE DASHBOARD CARD ═════════════════════════════════ */
    .gz-dash-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .gz-dash-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#10b981,#3b82f6);border-radius:2px 0 0 2px}
    .gz-dash-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
    .gz-dash-icon{font-size:2rem;flex-shrink:0;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(59,130,246,.1));border-radius:12px;border:1px solid rgba(16,185,129,.2)}
    .gz-dash-info{flex:1;min-width:0}
    .gz-dash-title{font-weight:800;font-size:.95rem;color:var(--text)}
    .gz-dash-sub{font-size:.72rem;color:var(--text3);margin-top:2px}
    .gz-dash-count{font-size:.72rem;font-weight:700;color:#10b981;margin-top:5px}
    .gz-dash-arrow{font-size:1.2rem;color:var(--text3);flex-shrink:0}
    /* ══ GARAGE ZONE PAGE ════════════════════════════════════════════ */
    .gz-page{display:flex;flex-direction:column;gap:0}
    .gz-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .gz-page-title{font-size:1.3rem;font-weight:800;color:var(--text)}
    .gz-page-sub{font-size:.72rem;color:var(--text3);margin-top:2px}
    .gz-add-btn{flex-shrink:0;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s}
    .gz-add-btn:hover{opacity:.88;transform:translateY(-1px)}
    /* Status pills */
    .gz-status-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .gz-status-pill{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
    .gz-status-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
    /* Location tabs */
    .gz-loc-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
    .gz-loc-tabs::-webkit-scrollbar{display:none}
    .gz-tab{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.75rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
    .gz-tab.active{background:var(--card);border-color:var(--ltc,var(--accent));color:var(--ltc,var(--accent));box-shadow:0 0 0 1px var(--ltc,var(--accent))22}
    .gz-tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    /* Category chips */
    .gz-cat-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
    .gz-cat-row::-webkit-scrollbar{display:none}
    .gz-chip{flex-shrink:0;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.72rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
    .gz-chip.active{background:rgba(249,115,22,.12);border-color:#f97316;color:#f97316}
    /* Search */
    .gz-search-wrap{position:relative;display:flex;align-items:center;margin-bottom:14px}
    .gz-search-icon{position:absolute;left:12px;font-size:.85rem;pointer-events:none}
    .gz-search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 36px 9px 34px;font-size:.82rem;color:var(--text);outline:none;box-sizing:border-box;transition:border-color .15s}
    .gz-search-input:focus{border-color:var(--accent)}
    .gz-search-clear{position:absolute;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:.85rem;padding:4px}
    .gz-filter-info{font-size:.72rem;color:var(--text3);margin-bottom:10px}
    /* Groups */
    .gz-group{margin-bottom:20px}
    .gz-group-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 0}
    .gz-group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .gz-group-name{font-size:.72rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);flex:1}
    .gz-group-count{font-size:.7rem;font-weight:700;background:var(--card2);border-radius:10px;padding:1px 7px;color:var(--text3)}
    /* Item cards */
    .gz-item-card{display:flex;align-items:flex-start;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;transition:all .15s}
    .gz-item-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
    .gz-item-card.gz-lent{border-color:rgba(139,92,246,.25)}
    .gz-item-card.gz-overdue{border-color:rgba(220,38,38,.35)}
    .gz-item-accent{width:4px;flex-shrink:0;align-self:stretch}
    .gz-item-body{flex:1;min-width:0;padding:12px 10px 12px 12px}
    .gz-item-name{font-weight:700;font-size:.88rem;color:var(--text)}
    .gz-item-desc{font-size:.72rem;color:var(--text2);margin-top:2px}
    .gz-item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
    .gz-loc-tag{font-size:.65rem;font-weight:700}
    .gz-lent-badge{background:rgba(139,92,246,.08);border-radius:6px;padding:4px 8px;font-size:.7rem;color:#8b5cf6;margin-top:6px;display:flex;flex-direction:column;gap:2px}
    .gz-item-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding:10px 10px 10px 4px;flex-shrink:0}
    /* ══ VOICE ADD ══════════════════════════════════════════════════ */
    .voice-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;
      height:55px;padding:0 16px;border-radius:14px;border:none;cursor:pointer;font-size:.82rem;font-weight:700;
      background:var(--card);border:1.5px solid var(--border2);color:var(--text2);transition:all .2s}
    .voice-btn:hover{border-color:#8b5cf6;color:#8b5cf6;background:rgba(139,92,246,.08)}
    @media(max-width:560px){.voice-btn{width:100%;height:44px}}
    /* Overlay */
    .voice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1100;
      display:flex;align-items:flex-end;justify-content:center;
      padding-bottom:env(safe-area-inset-bottom);animation:vFadeIn .18s ease}
    @keyframes vFadeIn{from{opacity:0}to{opacity:1}}
    .voice-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:520px;
      padding:20px 22px 36px;text-align:center;animation:vSlideUp .22s ease;position:relative}
    @keyframes vSlideUp{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
    /* Always-visible close */
    .voice-close{position:absolute;top:14px;right:16px;width:32px;height:32px;
      border-radius:50%;border:none;background:var(--border2);color:var(--text2);
      font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .15s;z-index:2}
    .voice-close:hover{background:var(--red);color:#fff}
    .voice-sheet-title{font-size:.92rem;font-weight:800;margin-bottom:16px}
    /* Tap-to-speak button */
    .voice-tap-btn{display:flex;flex-direction:column;align-items:center;gap:8px;
      width:100%;background:none;border:none;cursor:pointer;padding:8px 0 4px;margin-bottom:4px}
    .voice-tap-ring{width:80px;height:80px;border-radius:50%;background:rgba(139,92,246,.1);
      border:2.5px solid #8b5cf6;display:flex;align-items:center;justify-content:center;
      font-size:2.4rem;transition:all .18s}
    .voice-tap-btn:hover .voice-tap-ring{background:rgba(139,92,246,.2);transform:scale(1.05)}
    .voice-tap-ring.vr-listening{background:rgba(239,68,68,.12);border-color:#ef4444;
      animation:vRingPulse 1.2s ease-in-out infinite}
    .voice-tap-ring.vr-done{background:rgba(45,212,191,.1);border-color:var(--green)}
    @keyframes vRingPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
      50%{box-shadow:0 0 0 18px rgba(239,68,68,0)}
    }
    .voice-tap-label{font-size:.74rem;color:var(--text3);font-weight:600;letter-spacing:.03em}
    /* Live transcript */
    .voice-live{font-size:.88rem;color:var(--text2);text-align:center;
      font-style:italic;padding:6px 0 2px;margin-bottom:4px;min-height:24px}
    .voice-live.v-final{color:var(--white);font-style:normal;font-weight:600}
    .voice-live.v-error{color:var(--red);font-style:normal}
    /* Hint */
    .voice-hint{font-size:.7rem;color:var(--text3);margin:6px 0 12px;line-height:1.4}
    /* Text fallback */
    .voice-text-row{display:flex;gap:8px;margin-bottom:14px}
    .voice-text-input{flex:1;background:var(--card2);border:1.5px solid var(--border2);border-radius:10px;
      padding:9px 12px;font-size:.85rem;color:var(--white);outline:none;transition:border-color .15s}
    .voice-text-input:focus{border-color:var(--accent)}
    .voice-text-go{background:var(--accent);color:#111;border:none;border-radius:10px;
      padding:0 14px;font-size:.82rem;font-weight:700;cursor:pointer;transition:filter .15s;white-space:nowrap}
    .voice-text-go:hover{filter:brightness(1.1)}
    /* Result card */
    .voice-result{background:var(--card2);border:1px solid var(--border);border-radius:14px;
      padding:14px 16px;margin:10px 0 12px;text-align:left}
    .voice-result-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:.83rem}
    .voice-result-row:last-child{margin-bottom:0}
    .voice-result-lbl{color:var(--text3);width:46px;flex-shrink:0;font-size:.75rem}
    .voice-result-val{font-weight:700;flex:1}
    .voice-add-btn{width:100%;background:var(--green);color:#111827;border:none;border-radius:12px;
      padding:12px 0;font-size:.9rem;font-weight:800;cursor:pointer;margin-bottom:10px;transition:filter .15s}
    .voice-add-btn:hover:not(:disabled){filter:brightness(1.1)}
    .voice-add-btn:disabled{opacity:.45;cursor:not-allowed}
    .voice-action-row{display:flex;gap:10px;justify-content:center}
    .voice-retry-btn{background:none;border:1.5px solid var(--border2);border-radius:10px;
      color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;padding:8px 16px;transition:all .15s}
    .voice-retry-btn:hover{border-color:#8b5cf6;color:#8b5cf6}
    .voice-edit-link{background:none;border:none;color:var(--accent);font-size:.78rem;
      font-weight:600;cursor:pointer;padding:8px 16px;text-decoration:underline}
    /* Success state */
    .voice-success{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
    .voice-success-icon{font-size:2.6rem}
    .voice-success-msg{font-size:.9rem;font-weight:700;color:var(--white)}
    .voice-success-sub{font-size:.75rem;color:var(--text3)}
    .voice-success-btns{display:flex;gap:10px;margin-top:10px;width:100%}
    .voice-success-btns button{flex:1;padding:10px 0;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;transition:filter .15s}
    .v-view-btn{background:var(--accent);color:#111}
    .v-view-btn:hover{filter:brightness(1.08)}
    .v-another-btn{background:var(--border2);color:var(--text)}
    .v-another-btn:hover{filter:brightness(1.15)}
    /* ══ GLOBAL ADD INTELLIGENCE ════════════════════════════════════ */
    .gai-wrap{display:flex;align-items:flex-start;gap:10px;max-width:620px;margin:0 auto 36px}
    .gai-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
      background:linear-gradient(135deg,var(--accent),#0d9488);
      color:#fff;border:none;border-radius:10px;padding:0 14px;
      font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;
      height:46px;transition:all .18s;box-shadow:0 4px 14px rgba(0,179,152,.22)}
    .gai-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,179,152,.35)}
    @media(min-width:780px){.gai-wrap{max-width:780px;margin:0 0 36px}.gai-btn{height:55px;padding:0 18px;font-size:.85rem}}
    @media(max-width:560px){.gai-wrap{flex-direction:column;max-width:100%}.gai-btn{width:100%;justify-content:center;height:44px}}
    /* Modal overlay */
    .gai-overlay{position:fixed;top:0;right:0;bottom:0;left:0;
      background:rgba(0,0,0,.65);z-index:500;display:flex;
      align-items:flex-end;justify-content:center}
    @media(min-width:620px){.gai-overlay{align-items:center}}
    .gai-modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;
      max-width:580px;max-height:90vh;overflow-y:auto;
      animation:slideUp .22s ease}
    @keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
    @media(min-width:620px){.gai-modal{border-radius:18px;max-height:85vh}}
    .gai-modal-hdr{display:flex;align-items:center;justify-content:space-between;
      padding:16px 18px 12px;border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--card);z-index:1;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
    .gai-modal-title{font-size:.9rem;font-weight:800;color:var(--white)}
    .gai-modal-cls{background:none;border:none;color:var(--text3);cursor:pointer;
      font-size:.9rem;padding:4px 7px;border-radius:6px;transition:all .15s}
    .gai-modal-cls:hover{color:var(--white);background:var(--border)}
    .gai-modal-body{padding:16px 18px 24px}
    /* Box option grid */
    .gai-box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
    .gai-box-opt{border:2px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;
      transition:all .18s;background:var(--card2);text-align:left}
    .gai-box-opt:hover{border-color:var(--accent);background:var(--accent-dim)}
    .gai-box-opt.selected{border-color:var(--green) !important;background:rgba(45,212,191,.09)}
    .gai-box-opt-name{font-size:.76rem;font-weight:700;color:var(--text)}
    .gai-box-opt-sub{font-size:.62rem;color:var(--text3);margin-top:2px}
    .gai-box-opt.selected .gai-box-opt-name{color:var(--green)}
    .gai-box-opt.selected .gai-box-opt-sub{color:rgba(45,212,191,.7)}
    /* Submit button */
    .gai-submit{width:100%;margin-top:16px;padding:13px;
      background:var(--green);color:#111827;border:none;border-radius:11px;
      font-size:.88rem;font-weight:800;cursor:pointer;transition:all .15s}
    .gai-submit:hover:not(:disabled){filter:brightness(1.08)}
    .gai-submit:disabled{opacity:.35;cursor:default;filter:none}
  </style>
  <!-- Firebase Analytics -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand" id="hdr-brand" title="Go home" style="cursor:pointer">
      <div class="hdr-logo">&#128230;</div>
      <div class="hdr-text">
        <div class="hdr-title">Garage Organizer</div>
        <div class="hdr-sub" id="hdr-sub">Loading...</div>
      </div>
    </div>
    <div class="hdr-right"><button id="btn-home" class="hdr-home-btn" title="Home" aria-label="Home">&#127968;</button>
      <!-- View As (admin only) -->
      <div id="vas-hdr" class="vas-hdr" style="display:none">
        <button class="vas-hdr-btn" id="vas-hdr-btn" onclick="toggleVasDrop()">
          <span>&#128065;&#65039;</span>
          <span class="vas-hdr-lbl" id="vas-hdr-lbl">View As</span>
          <span class="vas-hdr-chev" id="vas-hdr-chev">&#9660;</span>
        </button>
        <div id="vas-hdr-drop" class="vas-hdr-drop" style="display:none">
          <div class="vas-hdr-drop-top">
            <span class="vas-hdr-drop-title">&#128065;&#65039; Impersonate User</span>
            <button class="vas-hdr-drop-cls" onclick="closeVasDrop()">&#10005;</button>
          </div>
          <div class="vas-hdr-drop-search">
            <span class="vas-search-icon">&#128269;</span>
            <input type="text" id="vas-hdr-q" class="vas-hdr-drop-input" placeholder="Search by name or email..." oninput="filterVasHdr(this.value)" autocomplete="off">
          </div>
          <div id="vas-hdr-list" class="vas-hdr-list"><div class="vas-empty">Loading users...</div></div>
        </div>
      </div>
      <!-- Theme toggle -->
      <div class="theme-toggle" title="Toggle theme">
        <button class="theme-btn" id="th-light" onclick="setTheme('light')" title="Light">☀️</button>
        <button class="theme-btn" id="th-system" onclick="setTheme('system')" title="System">💻</button>
        <button class="theme-btn active" id="th-dark" onclick="setTheme('dark')" title="Dark">🌙</button>
      </div>
      <button class="hdr-btn hidden" id="btn-back" onclick="goHome()">&#8592; <span>All Boxes</span></button>
      <!-- Account dropdown -->
      <div class="acct-wrap" id="acct-wrap" style="display:none">
        <button class="acct-btn" id="acct-btn"  aria-label="Account">
          <img id="acct-img" class="acct-avatar-img" src="" alt="" style="display:none">
          <span id="acct-init" class="acct-initials"></span>
          <span id="acct-badge" class="acct-badge">0</span>
        </button>
        <div class="acct-drop" id="acct-drop">
          <div class="acct-drop-user">
            <img id="acct-drop-img" class="acct-drop-av" src="" alt="">
            <div id="acct-drop-init" class="acct-drop-av-init"></div>
            <div class="acct-drop-info">
              <div class="acct-drop-name" id="acct-drop-name"></div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
                <div class="acct-drop-email" id="acct-drop-email"></div>
                <span class="sub-badge" id="sub-badge" style="display:none"></span>
              </div>
            </div>
          </div>
          <!-- Plan info card -->
          <div id="plan-info-card" style="margin:8px 12px;padding:10px 12px;background:var(--card2);border-radius:10px;border:1px solid var(--border)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
              <span style="font-size:.67rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.7px">Your Plan</span>
              <span id="plan-tier-badge" style="font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--border);color:var(--text)">Free</span>
            </div>
            <div id="plan-features" style="font-size:.72rem;color:var(--text2);line-height:1.75"></div>
          </div>
          <!-- Admin: User Management -->
          <div id="acct-mgmt-wrap" style="display:none">
            <div class="acct-drop-div"></div>
            <div class="acct-drop-section">&#128101; User Management</div>
            <div class="acct-mgmt-inner">
              <div class="user-mgmt-tabs" style="margin-bottom:10px">
                <button class="mgmt-tab on" id="mtab-users" onclick="switchMgmtTab('users')">&#10003; Approved</button>
                <button class="mgmt-tab" id="mtab-requests" onclick="switchMgmtTab('requests')">&#9203; Requests <span class="badge" id="req-badge2" style="display:none;background:var(--red)">0</span></button>
              </div>
              <div class="mgmt-panel" id="mgmt-panel">
                <div class="spin-w" style="padding:16px"><div class="spin"></div></div>
              </div>
            </div>
          </div>
          <!-- Subscription actions (native app only) -->
          <div id="sub-actions" style="display:none;border-top:1px solid var(--border)">
            <button id="sub-upgrade-pro" class="acct-sign-out" onclick="showPaywall('box_limit')" style="border-top:none;color:var(--accent)">&#11088; Upgrade to Pro</button><button id="sub-upgrade-family" class="acct-sign-out" onclick="showPaywall('box_limit')" style="border-top:none;color:var(--green);display:none">&#128106; Upgrade to Family</button>
            <button class="acct-sign-out" onclick="restorePurchases()" style="border-top:none;color:var(--text2)">&#8635; Restore Purchases</button>
          </div>
          <button class="acct-sign-out" onclick="signOut()">&#8617; Sign Out</button>
        </div>
      </div>
      <!-- Hidden stub so old btn-requests references don't break -->
      <button style="display:none" id="btn-requests"><span id="req-badge"></span></button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="pg" id="app">
