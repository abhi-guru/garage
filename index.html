<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b111c">
  <meta name="description" content="A private, QR-powered garage inventory for finding boxes, items, photos, and recent activity fast.">
  <title>Garage Organizer</title>
  <link rel="manifest" href="/garage/manifest.json">
  <link rel="apple-touch-icon" href="/garage/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Garage">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="msal-browser.min.js"></script>
  <script src="gdrive-storage.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ══ THEME TOKENS ══════════════════════════════════════════════ */
    :root{
      --accent:#f97316;--accent-h:#ea6b0a;--accent-dim:rgba(249,115,22,.12);
      --green:#22c55e;--green-dim:rgba(34,197,94,.12);
      --red:#ef4444;--red-dim:rgba(239,68,68,.12);
      --blue:#3b82f6;--blue-dim:rgba(59,130,246,.12);
      --gold:#fbbf24;--radius:14px;--radius-sm:10px;
      --shadow:0 4px 24px rgba(0,0,0,.12);
      --shadow-lg:0 12px 48px rgba(0,0,0,.18);
    }
    /* Dark */
    [data-theme="dark"]{
      --bg:#070d18;--surface:#0d1526;--card:#111d30;--card2:#152035;
      --border:#1a2d47;--border2:#213552;
      --text:#e2e8f0;--text2:#7a9bb5;--text3:#3d5a73;--white:#fff;
      --input-bg:rgba(255,255,255,.05);--input-border:#1a2d47;
      --hdr-bg:rgba(7,13,24,.95);--overlay:rgba(0,0,0,.8);
      --search-bg:#111d30;--search-border:#1a2d47;
      --drop-shadow:0 16px 60px rgba(0,0,0,.6);
    }
    /* Light */
    [data-theme="light"]{
      --bg:#f0f4f8;--surface:#fff;--card:#fff;--card2:#f8fafc;
      --border:#e2e8f0;--border2:#cbd5e1;
      --text:#0f172a;--text2:#475569;--text3:#94a3b8;--white:#0f172a;
      --input-bg:#fff;--input-border:#e2e8f0;
      --hdr-bg:rgba(255,255,255,.95);--overlay:rgba(0,0,0,.5);
      --search-bg:#fff;--search-border:#e2e8f0;
      --drop-shadow:0 16px 60px rgba(0,0,0,.15);
      --shadow:0 4px 24px rgba(0,0,0,.07);
      --shadow-lg:0 12px 48px rgba(0,0,0,.1);
    }

    /* ══ BASE ══════════════════════════════════════════════════════ */
    html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
    body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
      transition:background .3s,color .3s}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

    /* ══ ANIMATIONS ════════════════════════════════════════════════ */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .fade-up{animation:fadeUp .28s ease both}
    .fade-in{animation:fadeIn .22s ease both}
    .pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1) both}

    /* ══ HEADER ════════════════════════════════════════════════════ */
    .hdr{background:var(--hdr-bg);border-bottom:1px solid var(--border);
      padding:calc(12px + env(safe-area-inset-top,40px)) 20px 12px;position:sticky;top:0;z-index:100;
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      transition:background .3s,border-color .3s}
    .hdr-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px}
    .hdr-logo{width:34px;height:34px;flex-shrink:0;
      background:linear-gradient(135deg,#f97316,#dc2626);border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:1rem;
      box-shadow:0 4px 14px rgba(249,115,22,.35)}
    .hdr-brand{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;
      border-radius:8px;padding:2px 4px;transition:background .15s;text-decoration:none}
    .hdr-brand:hover{background:rgba(255,255,255,.08)}
    .hdr-text{flex:1;min-width:0;overflow:hidden}
    .hdr-title{font-size:.92rem;font-weight:800;color:var(--white);letter-spacing:.2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hdr-sub{font-size:.58rem;color:var(--accent);font-weight:700;letter-spacing:1px;
      text-transform:uppercase;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

    /* Theme toggle — compact on mobile */
    .theme-toggle{display:flex;background:var(--card);border:1px solid var(--border);
      border-radius:9px;padding:2px;gap:1px;flex-shrink:0}
    .theme-btn{width:26px;height:24px;border:none;background:transparent;border-radius:6px;
      cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;
      transition:all .15s;color:var(--text2)}
    .theme-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(249,115,22,.35)}
    .theme-btn:not(.active):hover{background:var(--card2);color:var(--text)}

    .hdr-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);
      padding:6px 10px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;
      display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;flex-shrink:0}
    .hdr-btn:hover{border-color:var(--accent);color:var(--accent)}
    .hdr-btn.hidden{display:none}
    /* Account dropdown */
    .acct-wrap{position:relative;flex-shrink:0}
    .hdr-home-btn{background:none;border:none;cursor:pointer;font-size:1.25rem;padding:4px 6px;border-radius:8px;color:var(--text);opacity:.7;transition:opacity .2s}.hdr-home-btn:hover{opacity:1}.acct-btn{position:relative;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);
      background:var(--card2);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
      overflow:visible;transition:border-color .15s}
    .acct-btn:hover{border-color:var(--green)}
    .acct-btn.open{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
    .acct-avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
    .acct-initials{font-size:.75rem;font-weight:900;color:var(--accent);line-height:1;pointer-events:none}
    .acct-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
      border-radius:50%;min-width:16px;height:16px;font-size:.58rem;font-weight:800;
      display:none;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 2px}
    .acct-drop{position:fixed;top:56px;right:10px;z-index:950;width:350px;
      background:var(--card);border:1px solid var(--border2);border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;display:none}
    .acct-drop.open{display:block}
    .acct-drop-user{padding:16px 16px 14px;display:flex;align-items:center;gap:12px}
    .acct-drop-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);
      object-fit:cover;flex-shrink:0;display:none}
    .acct-drop-av-init{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#0d9488);
      display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;color:#fff;flex-shrink:0}
    .acct-drop-info{flex:1;min-width:0}
    .acct-drop-name{font-weight:800;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .acct-drop-email{font-size:.68rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .acct-drop-div{height:1px;background:var(--border);margin:0}
    .acct-drop-section{padding:10px 14px 6px;font-size:.67rem;font-weight:800;color:var(--text3);
      text-transform:uppercase;letter-spacing:.8px}
    .acct-mgmt-inner{padding:0 12px 12px;max-height:340px;overflow-y:auto}
    .acct-sign-out{width:100%;background:none;border:none;border-top:1px solid var(--border);
      text-align:left;padding:13px 16px;color:var(--red);font-size:.82rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
    .acct-sign-out:hover{background:rgba(239,68,68,.08)}
    .badge{background:var(--red);color:#fff;font-size:.57rem;font-weight:800;
      min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;
      justify-content:center;padding:0 4px;animation:pulse 2s infinite}
    .avatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);
      object-fit:cover;cursor:pointer;flex-shrink:0}

    /* On very small screens hide the ← All Boxes text, show just icon */
    @media(max-width:420px){
      #btn-back span{display:none}
      .hdr-btn#btn-requests span.btn-label{display:none}
    }

    /* ══ PAGE SHELL ════════════════════════════════════════════════ */
    .pg{max-width:900px;margin:0 auto;padding:28px 16px 60px}

    /* ══ AUTH SCREEN ═══════════════════════════════════════════════ */
    .auth-screen{min-height:calc(100vh - 64px);display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:24px;text-align:center}
    .auth-orb{width:96px;height:96px;border-radius:26px;margin:0 auto 24px;
      background:linear-gradient(135deg,#f97316,#dc2626 50%,#7c3aed);
      display:flex;align-items:center;justify-content:center;font-size:2.6rem;
      box-shadow:0 20px 56px rgba(249,115,22,.38);animation:float 3s ease-in-out infinite}
    .auth-title{font-size:1.9rem;font-weight:900;color:var(--white);line-height:1.15;margin-bottom:10px}
    .auth-title span{background:linear-gradient(135deg,var(--accent),#fbbf24);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .auth-sub{font-size:.88rem;color:var(--text2);line-height:1.6;max-width:300px;margin:0 auto 32px}
    .google-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#1f2937;
      border:none;padding:13px 28px;border-radius:12px;font-size:.92rem;font-weight:700;
      cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.25);margin:0 auto}
    .google-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.35)}
    .google-btn:active{transform:scale(.97)}
    .google-icon{width:20px;height:20px}
    .auth-note{font-size:.68rem;color:var(--text3);margin-top:20px;line-height:1.5}
    .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0 8px;color:var(--text3);font-size:.72rem}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .gdrive-create-btn{gap:10px}

    /* ══ REQUEST / PENDING ═════════════════════════════════════════ */
    .req-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
      padding:28px 24px;max-width:420px;margin:32px auto 0}
    .req-header{text-align:center;margin-bottom:22px}
    .req-icon{font-size:2.2rem;margin-bottom:10px}
    .req-title{font-size:1.1rem;font-weight:800;color:var(--white);margin-bottom:6px}
    .req-sub{font-size:.78rem;color:var(--text2);line-height:1.5}
    .user-pill{display:flex;align-items:center;gap:10px;background:var(--card2);
      border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:18px}
    .user-pill img{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent)}
    .user-pill-name{font-weight:700;font-size:.88rem;color:var(--white)}
    .user-pill-email{font-size:.68rem;color:var(--text2);font-family:monospace;margin-top:1px}
    .pending-screen{text-align:center;padding:60px 24px}
    .pending-orb{width:68px;height:68px;border-radius:20px;
      background:linear-gradient(135deg,var(--gold),#f97316);
      display:flex;align-items:center;justify-content:center;font-size:2rem;
      margin:0 auto 20px;animation:pulse 2s ease-in-out infinite}
    .pending-title{font-size:1.2rem;font-weight:800;color:var(--white);margin-bottom:8px}
    .pending-sub{font-size:.82rem;color:var(--text2);line-height:1.6;max-width:300px;margin:0 auto}

    /* ══ DASHBOARD HERO ════════════════════════════════════════════ */
    .dash-hero{text-align:center;padding:36px 16px 28px;position:relative}
    .dash-hero-badge{display:inline-flex;align-items:center;gap:6px;
      background:var(--accent-dim);border:1px solid rgba(249,115,22,.2);
      border-radius:20px;padding:4px 12px;font-size:.65rem;font-weight:700;
      color:var(--accent);letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
    .dash-hero-title{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;
      color:var(--white);line-height:1.15;margin-bottom:8px}
    .dash-hero-sub{font-size:.85rem;color:var(--text2);line-height:1.5;
      max-width:400px;margin:0 auto 28px}

    /* ══ GOOGLE-STYLE SEARCH BAR ═══════════════════════════════════ */
    .search-hero{max-width:620px;margin:0 auto 36px;position:relative}
    .search-box{display:flex;align-items:center;gap:0;
      background:var(--search-bg);border:1.5px solid var(--search-border);
      border-radius:100px;padding:6px 8px 6px 20px;
      box-shadow:var(--shadow);transition:all .25s;cursor:text}
    .search-box:focus-within{border-color:var(--accent);
      box-shadow:0 0 0 4px var(--accent-dim),var(--shadow-lg)}
    .search-icon-big{font-size:1.1rem;color:var(--text2);flex-shrink:0;margin-right:10px}
    .search-input{flex:1;border:none;background:transparent;font-size:1rem;
      color:var(--text);outline:none;padding:8px 0;min-width:0}
    .search-input::placeholder{color:var(--text3)}
    .search-clear{background:none;border:none;color:var(--text3);cursor:pointer;
      padding:4px 8px;font-size:1rem;display:none;transition:color .15s}
    .search-clear.show{display:flex;align-items:center}
    .search-clear:hover{color:var(--text)}
    .search-divider{width:1px;height:24px;background:var(--border);margin:0 4px;flex-shrink:0}
    .search-submit{background:var(--accent);color:#fff;border:none;
      padding:10px 20px;border-radius:100px;font-size:.85rem;font-weight:700;
      cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
    .search-submit:hover{background:var(--accent-h);transform:scale(1.03)}

    /* Inline search results transition */
    #search-results{transition:opacity .2s}

    /* ══ STATS ROW ═════════════════════════════════════════════════ */
    .stats-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .stat-pill{flex:1;min-width:80px;background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:12px 16px;text-align:center}
    .stat-num{font-size:1.4rem;font-weight:900;color:var(--accent)}
    .stat-lbl{font-size:.6rem;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}

    /* ══ SECTION LABEL ═════════════════════════════════════════════ */
    .sec{font-size:.62rem;font-weight:700;color:var(--text3);letter-spacing:1.3px;
      text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .sec::after{content:'';flex:1;height:1px;background:var(--border)}

    /* ══ SEARCH RESULTS VIEW ═══════════════════════════════════════ */
    .results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .results-title{font-size:.85rem;font-weight:700;color:var(--text2)}
    .results-clear{background:none;border:none;color:var(--accent);font-size:.78rem;
      font-weight:700;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background .15s}
    .results-clear:hover{background:var(--accent-dim)}
    .res-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:8px;transition:border-color .15s;cursor:default}
    .res-card:hover{border-color:rgba(249,115,22,.2)}
    .res-box{font-size:.6rem;font-weight:700;color:var(--blue);font-family:monospace;
      text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .res-name{font-weight:600;font-size:.9rem;color:var(--white)}
    .res-name mark{background:transparent;color:var(--accent);font-weight:800}
    .res-desc{font-size:.73rem;color:var(--text2);margin-top:3px}

    /* ══ BOX GRID ══════════════════════════════════════════════════ */
    .box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    @media(max-width:600px){.box-grid{grid-template-columns:1fr}}
    .box-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:18px;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
    /* Box cover photo */
    .box-cover-wrap{margin:-18px -18px 0;position:relative;height:110px;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0}
    .box-cover-img{width:100%;height:110px;object-fit:cover;display:block}
    .box-cover-change{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);
      color:#fff;border:none;border-radius:8px;padding:4px 9px;font-size:.65rem;
      font-weight:600;cursor:pointer;backdrop-filter:blur(4px);transition:background .15s}
    .box-cover-change:hover{background:rgba(0,0,0,.8)}
    .box-cover-add{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:var(--card2);cursor:pointer;border:none;width:100%;font-size:.72rem;
      color:var(--text3);gap:6px;transition:background .15s;flex-direction:column}
    .box-cover-add:hover{background:var(--border2);color:var(--text2)}
    .box-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--bca,linear-gradient(180deg,var(--accent),#dc2626));border-radius:2px 0 0 2px}
    .box-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
    .box-card-top{display:flex;align-items:flex-start;gap:12px}
    .box-ico{width:46px;height:46px;border-radius:12px;flex-shrink:0;
      background:linear-gradient(135deg,var(--accent-dim),transparent);
      border:1px solid rgba(249,115,22,.15);display:flex;align-items:center;
      justify-content:center;font-size:1.35rem}
    .box-info{flex:1;min-width:0}
    .box-name{font-weight:800;font-size:.95rem;color:var(--white);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .box-id{font-size:.62rem;color:var(--text3);font-family:monospace}
    .box-cnt{font-size:.72rem;color:var(--text2);margin-top:4px;font-weight:500}
    .box-card-btns{display:flex;gap:8px;align-items:center}
    .btn-view{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent-h));
      color:#fff;border:none;padding:9px 12px;border-radius:9px;font-size:.78rem;
      font-weight:700;cursor:pointer;transition:all .15s;
      box-shadow:0 3px 12px rgba(249,115,22,.25);text-align:center}
    .btn-view:hover{transform:scale(1.03);box-shadow:0 5px 18px rgba(249,115,22,.4)}
    .btn-qr{background:#fff;border:1.5px solid var(--border2);width:44px;height:44px;
      border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .15s;flex-shrink:0;overflow:hidden;padding:4px;position:relative}
    .btn-qr:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);transform:scale(1.05)}
    .btn-qr img{width:100%;height:100%;border-radius:3px;display:block;pointer-events:none}
    .btn-qr .qr-label{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(249,115,22,.9);border-radius:7px;
      display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;
      color:#fff;letter-spacing:.4px;text-transform:uppercase;opacity:0;transition:opacity .15s;
      pointer-events:none}
    .btn-qr:hover .qr-label{opacity:1}

    /* ══ NEW BOX ════════════════════════════════════════════════════ */
    .new-box{background:var(--green-dim);border:1.5px dashed rgba(34,197,94,.22);
      border-radius:var(--radius);padding:20px;margin-top:8px}
    .new-box-title{font-size:.7rem;font-weight:700;color:var(--green);letter-spacing:.8px;
      text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px}
    .form-row{display:flex;gap:10px}
    .fld{margin-bottom:10px;flex:1}
    .fld label{display:block;font-size:.62rem;font-weight:700;color:var(--text2);
      letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
    input[type=text],input[type=number],textarea{width:100%;padding:11px 14px;
      background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);
      font-size:.88rem;color:var(--text);outline:none;transition:all .2s;-webkit-appearance:none}
    input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
    input::placeholder,textarea::placeholder{color:var(--text3)}
    .btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);
      font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s}
    .btn:active{transform:scale(.98)}
    .btn-green{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;
      box-shadow:0 4px 14px rgba(34,197,94,.25)}
    .btn-orange{background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
      box-shadow:0 4px 14px rgba(249,115,22,.25)}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

    /* ══ BOX DETAIL (items/add/search tabs) ════════════════════════ */
    .box-detail-hdr{margin-bottom:20px}
    .box-detail-name{font-size:1.2rem;font-weight:900;color:var(--white);margin-bottom:4px}
    .box-detail-id{font-size:.68rem;color:var(--text3);font-family:monospace}
    .tabs{display:flex;gap:5px;margin-bottom:16px;background:var(--card);
      border:1px solid var(--border);border-radius:var(--radius);padding:5px}
    .tab{flex:1;padding:9px 4px;border:none;border-radius:var(--radius-sm);background:transparent;
      cursor:pointer;font-size:.73rem;font-weight:600;color:var(--text2);text-align:center;transition:all .15s}
    .tab.on{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(249,115,22,.3)}
    .item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 16px;display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;transition:border-color .15s}
    .item:hover{border-color:rgba(249,115,22,.2)}
    .item-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex-shrink:0;margin-top:7px}
    .item-body{flex:1;min-width:0}
    .item-name{font-weight:600;font-size:.9rem;color:var(--white)}
    .item-desc{font-size:.73rem;color:var(--text2);margin-top:3px;line-height:1.4}
    .item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .tag{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
    .tag-cat{background:var(--blue-dim);color:#93c5fd}
    .tag-date{background:rgba(255,255,255,.05);color:var(--text2);font-family:monospace}
    .tag-qty{background:rgba(45,212,191,.12);color:var(--green);font-weight:800}
    .item-del{background:none;border:none;color:var(--text3);cursor:pointer;
      padding:4px 6px;border-radius:6px;transition:all .15s;flex-shrink:0}
    .item-del:hover{color:var(--red);background:var(--red-dim)}
    .form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .form-ttl{font-size:.7rem;font-weight:700;color:var(--accent);letter-spacing:.8px;
      text-transform:uppercase;margin-bottom:16px}

    /* ══ PAYWALL ═════════════════════════════════════════════════════ */
    .paywall-box{max-width:340px;text-align:center}
    .paywall-tier-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left}
    .paywall-tier-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .paywall-tier-name{font-weight:800;font-size:.9rem;color:var(--text)}
    .paywall-tier-price{font-weight:800;font-size:1.1rem;color:var(--accent)}
    .paywall-tier-per{font-size:.72rem;font-weight:400;color:var(--text2)}
    .paywall-tier-perks{font-size:.78rem;color:var(--text2);line-height:1.9;margin-bottom:12px}
    .paywall-btn{width:100%;padding:11px;border-radius:10px;font-weight:700;font-size:.82rem;cursor:pointer;border:none;transition:opacity .15s}
    .paywall-btn-pro{background:var(--accent);color:#fff}
    .paywall-btn-fam{background:var(--green);color:#fff}
    .paywall-btn:hover{opacity:.85}
    .sub-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;vertical-align:middle;margin-left:4px;letter-spacing:.3px}
    .lock-note{font-size:.68rem;color:var(--text3);opacity:.7;margin-left:4px}

    /* ══ EXPORT CSV ═════════════════════════════════════════════════ */
    .btn-csv{background:transparent;border:1px solid var(--border2);color:var(--text2);
      padding:7px 12px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;
      transition:all .15s;white-space:nowrap}
    .btn-csv:hover{border-color:var(--green);color:var(--green)}

    /* ══ DELETE BOX ═════════════════════════════════════════════════ */
    .btn-del-box{background:transparent;border:1px solid rgba(251,77,93,.25);color:var(--red);
      padding:7px 12px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;
      transition:all .15s;white-space:nowrap;flex-shrink:0;margin-top:4px}
    .btn-del-box:hover{background:var(--red);color:#fff;border-color:var(--red)}

    /* ══ ADMIN ══════════════════════════════════════════════════════ */
    .admin-banner{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(249,115,22,.05));
      border:1px solid rgba(251,191,36,.2);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .req-item{background:var(--card2);border:1px solid var(--border2);
      border-radius:var(--radius-sm);padding:14px;margin-bottom:8px}
    .req-name{font-weight:700;font-size:.88rem;color:var(--white)}
    .req-email{font-size:.7rem;color:var(--text2);font-family:monospace;margin-top:2px}
    .req-msg{font-size:.73rem;color:var(--text2);margin-top:6px;font-style:italic}
    .req-btns{display:flex;gap:8px;margin-top:12px}
    .req-btns button{flex:1;padding:8px;border-radius:8px;font-size:.75rem;
      font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-approve{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2)!important}
    .btn-approve:hover{background:var(--green);color:#fff}
    .btn-deny{background:var(--red-dim);color:#f87171;border:1px solid rgba(239,68,68,.2)!important}
    .btn-deny:hover{background:var(--red);color:#fff}

    /* ══ QR MODAL ═══════════════════════════════════════════════════ */
    .modal{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:400;
      display:flex;align-items:center;justify-content:center;padding:20px;
      backdrop-filter:blur(8px);animation:fadeIn .2s ease}
    .modal-box{background:var(--card);border:1px solid var(--border2);border-radius:22px;
      padding:28px 24px;max-width:320px;width:100%;text-align:center;animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
    .modal-title{font-size:1rem;font-weight:800;color:var(--white);margin-bottom:3px}
    .modal-id{font-size:.65rem;color:var(--text2);font-family:monospace;margin-bottom:18px}
    .qr-wrap{background:#fff;border-radius:14px;padding:14px;display:inline-block;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .qr-wrap img{display:block;width:180px;height:180px}
    .modal-url-box{background:var(--card2);border:1px solid var(--border);border-radius:9px;
      padding:9px 12px;font-size:.62rem;color:var(--text2);font-family:monospace;
      word-break:break-all;margin-bottom:14px;text-align:left}
    .modal-note{font-size:.67rem;color:var(--text3);margin-bottom:16px;line-height:1.5}
    .modal-btns{display:flex;gap:8px}
    .modal-btns button{flex:1;padding:10px;border-radius:9px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-print{background:var(--accent);color:#fff}
    .btn-print:hover{background:var(--accent-h)}
    .btn-close-m{background:var(--card2);color:var(--text2);border:1px solid var(--border)!important}
    .btn-close-m:hover{color:var(--white)}
    .qr-success-badge{background:var(--green-dim);border:1px solid rgba(34,197,94,.2);
      border-radius:8px;padding:7px 12px;font-size:.7rem;color:var(--green);
      font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px}

    /* ══ EDIT ITEM ══════════════════════════════════════════════════ */
    .item-edit{background:none;border:none;color:var(--text3);cursor:pointer;
      padding:4px 6px;border-radius:6px;transition:all .15s;flex-shrink:0;font-size:.8rem}
    .item-edit:hover{color:var(--gold);background:rgba(247,201,72,.12)}
    .edit-modal-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;
      padding:24px;max-width:380px;width:100%;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
    .edit-modal-box .form-ttl{margin-bottom:14px;font-size:.7rem;font-weight:700;
      color:var(--gold);letter-spacing:.8px;text-transform:uppercase}
    .edit-btns{display:flex;gap:8px;margin-top:4px}
    .edit-btns button{flex:1;padding:11px;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-edit-save{background:var(--gold);color:#111827}
    .btn-edit-save:hover{background:#e5b800}
    .btn-edit-cancel{background:var(--card2);color:var(--text2);border:1px solid var(--border)!important}

    /* ══ MOVE ITEM ═══════════════════════════════════════════════════ */
    .item-move{background:var(--blue-dim);border:1px solid rgba(79,140,255,.2);color:var(--blue);cursor:pointer;
      padding:5px 9px;border-radius:7px;transition:all .15s;flex-shrink:0;font-size:.72rem;
      font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
    .item-move:hover{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-1px)}
    .item-move-lbl{font-size:.68rem;font-weight:700}
    @media(max-width:440px){.item-move-lbl{display:none}}
    .move-modal-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;
      padding:24px;max-width:340px;width:100%;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
    .move-item-name{font-size:.95rem;font-weight:700;color:var(--white);margin-bottom:4px}
    .move-from-label{font-size:.68rem;color:var(--text2);margin-bottom:18px;font-family:monospace}
    .move-select{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);
      border-radius:var(--radius-sm);font-size:.88rem;color:var(--text);outline:none;
      margin-bottom:14px;font-family:inherit}
    .move-select:focus{border-color:var(--blue)}
    .move-btns{display:flex;gap:8px}
    .move-btns button{flex:1;padding:11px;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-move-confirm{background:var(--blue);color:#fff}
    .btn-move-confirm:hover{background:#2563eb}
    .btn-move-cancel{background:var(--card2);color:var(--text2);border:1px solid var(--border)!important}

    /* ══ RECENT ACTIVITY ════════════════════════════════════════════ */
    .activity-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;
      border-bottom:1px solid var(--border);cursor:default}
    .activity-row:last-child{border:none}
    .activity-dot{width:8px;height:8px;background:var(--green);border-radius:50%;flex-shrink:0;
      margin-top:5px;box-shadow:0 0 6px rgba(34,197,94,.5)}
    .activity-info{flex:1;min-width:0}
    .activity-name{font-size:.85rem;font-weight:600;color:var(--text);
      word-break:break-word;line-height:1.3;margin-bottom:4px}
    .activity-meta{font-size:.68rem;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .activity-box-btn{font-size:.62rem;font-weight:700;color:var(--blue);background:var(--blue-dim);
      border:none;border-radius:5px;padding:2px 7px;cursor:pointer;
      transition:all .15s;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
    .activity-box-btn:hover{background:var(--blue);color:#fff}
    .activity-box-deleted{font-size:.62rem;font-weight:600;color:var(--text3);background:var(--card2);border-radius:5px;padding:2px 7px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
    .activity-date{font-size:.62rem;color:var(--text3);white-space:nowrap;margin-top:4px}

    /* ══ USER MANAGEMENT ═════════════════════════════════════════════ */
    .user-mgmt-card{background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
    .user-mgmt-tabs{display:flex;border-bottom:1px solid var(--border)}
    .mgmt-tab{flex:1;padding:10px;border:none;background:transparent;cursor:pointer;
      font-size:.75rem;font-weight:600;color:var(--text2);transition:all .15s;
      border-bottom:2px solid transparent;margin-bottom:-1px}
    .mgmt-tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim)}
    .mgmt-panel{padding:16px}
    .user-row{display:flex;align-items:center;gap:10px;padding:10px 0;
      border-bottom:1px solid var(--border)}
    .user-row:last-child{border:none}
    .user-avatar-sm{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#dc2626);
      display:flex;align-items:center;justify-content:center;font-size:.9rem;
      color:#fff;font-weight:700;flex-shrink:0}
    .user-info{flex:1;min-width:0}
    .user-name{font-size:.85rem;font-weight:600;color:var(--text)}
    .user-email{font-size:.68rem;color:var(--text2);font-family:monospace;margin-top:1px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-role{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
    .role-admin{background:rgba(251,191,36,.15);color:var(--gold)}
    .role-viewer{background:var(--blue-dim);color:var(--blue)}
    .user-remove{background:none;border:1px solid var(--border);color:var(--text3);
      padding:5px 10px;border-radius:7px;font-size:.7rem;font-weight:600;cursor:pointer;
      transition:all .15s;flex-shrink:0}
    .user-remove:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

    /* ══ USER DRILL-DOWN ════════════════════════════════════════════ */
    .user-search-wrap{position:relative;margin-bottom:14px}
    .user-search-wrap input{width:100%;padding:9px 36px 9px 36px;background:var(--card2);
      border:1px solid var(--border);border-radius:10px;font-size:.82rem;color:var(--text);
      outline:none;transition:border-color .2s}
    .user-search-wrap input:focus{border-color:var(--accent)}
    .user-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
      color:var(--text3);font-size:.85rem;pointer-events:none}
    .user-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:none;border:none;color:var(--text3);cursor:pointer;font-size:.85rem;display:none}
    .user-drill-back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;
      color:var(--text2);font-size:.75rem;font-weight:600;cursor:pointer;
      padding:0;margin-bottom:14px;transition:color .15s}
    .user-drill-back:hover{color:var(--accent)}
    .user-drill-name{font-size:1rem;font-weight:800;color:var(--white);margin-bottom:2px}
    .user-drill-email{font-size:.7rem;color:var(--text2);font-family:monospace;margin-bottom:16px}
    .box-perm-row{display:flex;align-items:center;gap:10px;padding:9px 0;
      border-bottom:1px solid var(--border)}
    .box-perm-row:last-child{border:none}
    .box-perm-icon{font-size:1.1rem;flex-shrink:0}
    .box-perm-name{flex:1;font-size:.85rem;font-weight:600;color:var(--text)}
    .box-perm-role{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:20px;
      background:rgba(249,115,22,.15);color:var(--accent);flex-shrink:0}
    .box-perm-remove{background:none;border:1px solid var(--border);color:var(--text3);
      padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:600;cursor:pointer;
      flex-shrink:0;transition:all .15s}
    .box-perm-remove:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
    .assign-box-row{display:flex;gap:8px;margin-top:14px}
    .assign-box-row select{flex:1;padding:9px 12px;background:var(--card2);
      border:1px solid var(--border);border-radius:9px;font-size:.82rem;
      color:var(--text);outline:none}
    .assign-box-row select:focus{border-color:var(--accent)}
    .assign-box-btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;
      border-radius:9px;font-size:.78rem;font-weight:700;cursor:pointer;
      white-space:nowrap;transition:all .15s;flex-shrink:0}
    .assign-box-btn:hover{background:var(--accent-h)}

    /* Search results — View Box button */
    .res-view-box{display:inline-flex;align-items:center;gap:4px;
      background:linear-gradient(135deg,var(--accent),var(--accent-h));
      color:#fff;border:none;border-radius:7px;padding:5px 11px;
      font-size:.7rem;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px}
    .res-view-box:hover{transform:scale(1.04);box-shadow:0 3px 10px rgba(249,115,22,.3)}

    /* ══ ITEM DETAIL VIEW ═══════════════════════════════════════════ */
    .item-detail-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;
      color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;padding:0;
      margin-bottom:18px;transition:color .15s}
    .item-detail-back:hover{color:var(--accent)}
    .item-detail-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
    .item-detail-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
      background:linear-gradient(180deg,var(--accent),#dc2626);border-radius:2px 0 0 2px}
    .item-detail-box-link{display:inline-flex;align-items:center;gap:6px;
      background:var(--blue-dim);border:1px solid rgba(59,130,246,.2);
      border-radius:20px;padding:4px 12px;font-size:.65rem;font-weight:700;
      color:var(--blue);cursor:pointer;transition:all .15s;margin-bottom:12px;
      font-family:monospace;letter-spacing:.3px;text-decoration:none}
    .item-detail-box-link:hover{background:var(--blue);color:#fff}
    .item-detail-name{font-size:1.3rem;font-weight:900;color:var(--white);line-height:1.2;margin-bottom:10px}
    .item-detail-desc{font-size:.88rem;color:var(--text2);line-height:1.6;margin-bottom:14px}
    .item-detail-meta{display:flex;gap:8px;flex-wrap:wrap}
    .item-detail-navigate{background:linear-gradient(135deg,var(--accent),var(--accent-h));
      color:#fff;border:none;padding:12px 20px;border-radius:var(--radius-sm);
      font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s;
      display:flex;align-items:center;gap:8px;margin-top:18px;width:100%;
      justify-content:center;box-shadow:0 4px 14px rgba(249,115,22,.25)}
    .item-detail-navigate:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(249,115,22,.4)}
    .item-detail-section{font-size:.65rem;font-weight:700;color:var(--text3);
      letter-spacing:1.2px;text-transform:uppercase;margin:20px 0 12px;
      display:flex;align-items:center;gap:8px}
    .item-detail-section::after{content:'';flex:1;height:1px;background:var(--border)}

    /* ══ PHOTOS ═════════════════════════════════════════════════════ */
    .photo-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:none;
      color:var(--blue);font-size:.68rem;font-weight:600;cursor:pointer;padding:0;
      margin-top:6px;transition:color .15s}
    .photo-btn:hover{color:var(--accent)}
    .photo-count-badge{background:var(--blue-dim);color:var(--blue);border-radius:10px;
      padding:1px 6px;font-size:.6rem;font-weight:700;margin-left:3px}
    .photo-modal{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:500;
      display:flex;flex-direction:column;animation:fadeIn .2s ease;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .photo-modal-hdr{display:flex;align-items:center;gap:12px;padding:16px 20px;
      border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
    .photo-modal-title{flex:1;font-weight:800;font-size:.95rem;color:var(--white);min-width:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .photo-modal-sub{font-size:.65rem;color:var(--text2);margin-top:2px;font-family:monospace}
    .photo-modal-close{background:rgba(255,255,255,.08);border:1px solid var(--border);
      color:var(--text2);width:34px;height:34px;border-radius:9px;cursor:pointer;
      font-size:1rem;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:all .15s}
    .photo-modal-close:hover{color:var(--white);border-color:var(--text2)}
    .photo-modal-body{flex:1;overflow-y:auto;padding:20px}
    .photo-upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);
      padding:28px 20px;text-align:center;margin-bottom:20px;transition:all .2s;cursor:pointer}
    .photo-upload-zone:hover,.photo-upload-zone.drag{border-color:var(--accent);background:var(--accent-dim)}
    .upload-icon{font-size:2rem;margin-bottom:8px;display:block}
    .upload-title{font-size:.88rem;font-weight:700;color:var(--white);margin-bottom:4px}
    .upload-sub{font-size:.72rem;color:var(--text2);line-height:1.5;margin-bottom:14px}
    .upload-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .upload-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
      border-radius:10px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;
      transition:all .15s}
    .upload-btn-cam{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(249,115,22,.25)}
    .upload-btn-cam:hover{background:var(--accent-h)}
    .upload-btn-file{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
    .upload-btn-file:hover{border-color:var(--accent);color:var(--accent)}
    .upload-progress{background:var(--card2);border-radius:8px;height:6px;margin-top:12px;overflow:hidden;display:none}
    .upload-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));
      border-radius:8px;transition:width .3s;width:0%}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    .photo-thumb{position:relative;border-radius:var(--radius-sm);overflow:hidden;
      aspect-ratio:1;padding-top:0;background:var(--card2);border:1px solid var(--border);
      cursor:pointer;transition:all .2s}
    /* Safari <15 fallback for aspect-ratio */
    @supports not (aspect-ratio:1){
      .photo-thumb{padding-top:100%;height:0}
      .photo-thumb img{position:absolute;top:0;left:0;width:100%;height:100%}
    }
    .photo-thumb:hover{transform:scale(1.03);border-color:var(--accent);
      box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-thumb img{pointer-events:none}
    .photo-thumb-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);
      border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;
      font-size:.7rem;display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .15s}
    .photo-thumb:hover .photo-thumb-del{opacity:1}
    .photo-thumb-del:hover{background:var(--red)}
    .photo-thumb-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));
      padding:16px 6px 6px;font-size:.58rem;color:#fff;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .photo-lightbox{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.95);z-index:600;
      display:flex;align-items:center;justify-content:center;padding:16px;
      animation:fadeIn .15s ease;cursor:zoom-out}
    .photo-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
      box-shadow:0 20px 60px rgba(0,0,0,.8);cursor:default;user-select:none}
    .photo-lightbox-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);
      border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;
      font-size:1.1rem;display:flex;align-items:center;justify-content:center}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);
      border:none;color:#fff;width:48px;height:64px;border-radius:8px;cursor:pointer;
      font-size:2rem;display:flex;align-items:center;justify-content:center;
      transition:background .15s;z-index:601}
    .lb-nav:hover{background:rgba(255,255,255,.3)}
    .lb-prev{left:12px}.lb-next{right:12px}
    .lb-counter{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      color:rgba(255,255,255,.7);font-size:.8rem;font-weight:600;letter-spacing:.05em}
    .lb-fullscreen{position:fixed;top:16px;left:16px;background:rgba(255,255,255,.15);
      border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;
      font-size:1.1rem;display:flex;align-items:center;justify-content:center;
      transition:background .15s}
    .lb-fullscreen:hover{background:rgba(255,255,255,.3)}

    /* ══ STATUS / EMPTY / SPINNER ══════════════════════════════════ */
    .st{padding:11px 14px;border-radius:var(--radius-sm);font-size:.8rem;
      margin-bottom:12px;font-weight:500;display:flex;align-items:center;gap:8px}
    .st-ok{background:var(--green-dim);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
    .st-err{background:var(--red-dim);color:#f87171;border:1px solid rgba(239,68,68,.2)}
    .st-info{background:var(--blue-dim);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
    .empty{text-align:center;padding:44px 20px;color:var(--text2)}
    .empty-ico{font-size:2.6rem;margin-bottom:12px;display:block}
    .empty-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:6px}
    .empty-sub{font-size:.78rem;color:var(--text2);line-height:1.5}
    .spin-w{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 20px}
    .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .7s linear infinite}
    .spin-lbl{font-size:.75rem;color:var(--text2);animation:pulse 2s infinite}
    .pag{display:flex;gap:8px;margin-top:12px;justify-content:center}
    .pag-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);
      padding:8px 16px;border-radius:9px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s}
    .pag-btn:hover{border-color:var(--accent);color:var(--accent)}
    .pag-info{text-align:center;font-size:.65rem;color:var(--text2);margin-top:8px}
    .refresh-btn{width:100%;background:transparent;border:1px solid var(--border);color:var(--text2);
      padding:10px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;cursor:pointer;
      margin-top:10px;transition:all .15s}
    .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
    .divider{height:1px;background:var(--border);margin:16px 0}

    /* ══ 2026 REVAMP: FAST COMMAND-CENTER UI ═════════════════════ */
    :root{
      --accent:#ff6b1a;--accent-h:#e85d12;--accent-dim:rgba(255,107,26,.12);
      --green:#2dd4bf;--green-dim:rgba(45,212,191,.12);
      --red:#fb4d5d;--red-dim:rgba(251,77,93,.12);
      --blue:#4f8cff;--blue-dim:rgba(79,140,255,.12);
      --gold:#f7c948;--radius:8px;--radius-sm:7px;
      --shadow:0 1px 2px rgba(0,0,0,.14),0 12px 34px rgba(0,0,0,.16);
      --shadow-lg:0 22px 70px rgba(0,0,0,.22);
    }
    [data-theme="dark"]{
      --bg:#070a0f;--surface:#0b111c;--card:#101722;--card2:#151e2b;
      --border:#263244;--border2:#354154;
      --text:#edf2f7;--text2:#9aa8ba;--text3:#627184;--white:#ffffff;
      --input-bg:#0d141f;--input-border:#2a3648;
      --hdr-bg:rgba(8,12,18,.82);--overlay:rgba(3,6,10,.78);
      --search-bg:#f8fafc;--search-border:#e2e8f0;
      --drop-shadow:0 24px 80px rgba(0,0,0,.55);
    }
    [data-theme="light"]{
      --bg:#f6f7f4;--surface:#ffffff;--card:#ffffff;--card2:#f1f5f3;
      --border:#d8ded9;--border2:#bbc7c0;
      --text:#17202a;--text2:#5a6673;--text3:#8b97a3;--white:#101820;
      --input-bg:#ffffff;--input-border:#d6ded8;
      --hdr-bg:rgba(255,255,255,.86);--overlay:rgba(15,23,42,.44);
      --search-bg:#ffffff;--search-border:#d5ddd7;
    }
    html{font-size:16px}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:
        linear-gradient(120deg,rgba(255,107,26,.11),transparent 26%),
        linear-gradient(300deg,rgba(45,212,191,.09),transparent 30%),
        var(--bg);
      line-height:1.45;
    }
    body::before{
      content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:-1;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 78%);
    }
    [data-theme="light"] body::before{
      background-image:
        linear-gradient(rgba(15,23,42,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(15,23,42,.04) 1px,transparent 1px);
    }
    button,input,textarea,select{font:inherit}
    button{touch-action:manipulation}
    .hdr{
      padding:calc(10px + env(safe-area-inset-top,40px)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
      box-shadow:0 1px 0 rgba(255,255,255,.06);
    }
    .hdr-inner{max-width:1120px;gap:11px}
    .hdr-logo{
      width:38px;height:38px;border-radius:8px;font-size:1rem;color:#101820;
      background:linear-gradient(135deg,#f7c948,#ff6b1a 58%,#2dd4bf);
      box-shadow:0 10px 26px rgba(255,107,26,.24);
    }
    .hdr-title{font-size:.96rem;letter-spacing:0}
    .hdr-sub{font-size:.62rem;color:var(--green);letter-spacing:.9px}
    .theme-toggle,.hdr-btn{background:rgba(255,255,255,.05);border-color:var(--border2)}
    .theme-btn{width:30px;height:28px;font-size:.82rem}
    .theme-btn.active{background:var(--white);color:var(--bg);box-shadow:none}
    .hdr-btn{min-height:34px;padding:7px 11px;border-radius:8px}
    .avatar{width:34px;height:34px;border-color:var(--green)}
    .pg{max-width:1120px;padding:28px 16px 76px}

    .auth-screen{
      min-height:calc(100vh - 58px);display:grid;place-items:center;text-align:left;
      padding:24px 12px;
    }
    .auth-panel{
      width:min(100%,720px);display:grid;grid-template-columns:1fr .82fr;gap:18px;
      align-items:stretch;
    }
    .auth-copy,.auth-action{
      border:1px solid var(--border);background:rgba(16,23,34,.82);
      border-radius:8px;box-shadow:var(--shadow);padding:26px;
    }
    [data-theme="light"] .auth-copy,[data-theme="light"] .auth-action{background:rgba(255,255,255,.88)}
    .auth-emblem{
      width:56px;height:56px;border-radius:8px;margin-bottom:18px;
      background:linear-gradient(135deg,#f7c948,#ff6b1a 58%,#2dd4bf);
      display:flex;align-items:center;justify-content:center;font-size:1.55rem;color:#111827;
    }
    .auth-title{font-size:clamp(2rem,6vw,4rem);letter-spacing:0;line-height:.98;margin-bottom:14px}
    .auth-title span{background:linear-gradient(135deg,#fff,#f7c948 45%,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    [data-theme="light"] .auth-title span{background:linear-gradient(135deg,#111827,#d45410 48%,#0f766e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .auth-sub{max-width:460px;margin:0;color:var(--text2);font-size:1rem}
    .auth-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
    .auth-kpi{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card2)}
    .auth-kpi b{display:block;color:var(--white);font-size:1.1rem}
    .auth-kpi span{font-size:.66rem;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
    .auth-action{display:flex;flex-direction:column;justify-content:center;text-align:center}
    .auth-action-title{font-size:.75rem;font-weight:800;color:var(--green);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
    .auth-note{font-size:.72rem}

    .dash-hero{
      text-align:left;padding:22px 0 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;
      align-items:end;gap:18px;
    }
    .dash-hero-badge{
      border-radius:999px;padding:5px 11px;background:rgba(45,212,191,.1);
      border-color:rgba(45,212,191,.24);color:var(--green);margin-bottom:13px;
    }
    .dash-hero-title{
      font-size:clamp(2.25rem,7vw,5.9rem);line-height:.88;letter-spacing:0;
      max-width:780px;
    }
    .dash-hero-sub{font-size:1rem;max-width:540px;margin:14px 0 0;color:var(--text2)}
    .dash-quick{
      display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;min-width:280px;
    }
    .dash-quick-item{
      background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;
      padding:12px 13px;min-height:76px;
    }
    [data-theme="light"] .dash-quick-item{background:rgba(255,255,255,.72)}
    .dash-quick-label{font-size:.64rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
    .dash-quick-value{font-size:1.55rem;font-weight:900;color:var(--white);line-height:1.1;margin-top:4px}
    .dash-quick-note{font-size:.72rem;color:var(--text2);margin-top:3px}

    .search-hero{max-width:780px;margin:0 0 28px}
    .search-box{
      border-radius:8px;padding:9px 10px 9px 16px;background:var(--search-bg);
      box-shadow:0 16px 42px rgba(0,0,0,.18);border-width:1px;
    }
    .search-box:focus-within{box-shadow:0 0 0 4px var(--accent-dim),0 18px 60px rgba(0,0,0,.2)}
    .search-input{color:#111827;font-size:1rem;padding:10px 0}
    [data-theme="light"] .search-input{color:var(--text)}
    .search-submit{border-radius:7px;padding:11px 18px;background:#111827;color:#fff}
    .search-submit:hover{background:#0f766e}
    .search-icon-big{color:#64748b}
    .search-clear{color:#64748b}

    .stats-row{display:none}
    .sec{
      margin-top:10px;color:var(--text2);font-size:.68rem;letter-spacing:1.2px;
    }
    .box-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
    .box-card,.res-card,.form-card,.user-mgmt-card,.req-item,.stat-pill{
      border-radius:8px;box-shadow:none;background:rgba(16,23,34,.88);
    }
    [data-theme="light"] .box-card,[data-theme="light"] .res-card,[data-theme="light"] .form-card,[data-theme="light"] .user-mgmt-card,[data-theme="light"] .req-item,[data-theme="light"] .stat-pill{
      background:rgba(255,255,255,.86);
    }
    .box-card{
      padding:16px;min-height:164px;justify-content:space-between;
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    }
    .box-card::before{width:100%;height:4px;bottom:auto;background:var(--bca,linear-gradient(90deg,var(--accent),var(--green),var(--blue)))}
    .box-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:var(--shadow)}
    .box-ico{width:44px;height:44px;border-radius:8px;background:var(--card2);border-color:var(--border2)}
    .box-name{font-size:1rem;letter-spacing:0}
    .box-id{font-size:.64rem}
    .btn-view,.btn-green,.btn-orange,.btn-print,.assign-box-btn,.btn-move-confirm{
      border-radius:7px;background:linear-gradient(135deg,var(--accent),#e85d12);box-shadow:none;
    }
    .btn-view{padding:10px 12px}
    .btn-view:hover,.btn-green:hover,.btn-orange:hover{transform:translateY(-1px)}
    .btn-qr{border-radius:7px;width:42px;height:42px}
    .new-box{border-radius:8px;background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.32)}
    input[type=text],input[type=number],textarea,.move-select,.assign-box-row select{
      border-radius:7px;min-height:42px;
    }
    .tabs{border-radius:8px;padding:4px;position:sticky;top:59px;z-index:20;backdrop-filter:blur(12px)}
    .tab{border-radius:6px;min-height:38px}
    .tab.on{background:#f8fafc;color:#111827;box-shadow:none}
    [data-theme="light"] .tab.on{background:#111827;color:#fff}
    .box-detail-hdr{
      padding:16px;border:1px solid var(--border);border-radius:8px;background:rgba(16,23,34,.72);
    }
    [data-theme="light"] .box-detail-hdr{background:rgba(255,255,255,.75)}
    .box-detail-name{font-size:clamp(1.35rem,4vw,2.35rem);line-height:1}
    .item{border-radius:8px;padding:13px 14px;background:rgba(16,23,34,.82)}
    [data-theme="light"] .item{background:rgba(255,255,255,.84)}
    .item-dot{width:4px;height:34px;border-radius:8px;background:linear-gradient(var(--accent),var(--green));margin-top:2px}
    .tag{border-radius:999px}
    .photo-modal-hdr{background:var(--surface)}
    .photo-upload-zone,.photo-thumb,.modal-box,.move-modal-box,.item-detail-hero{border-radius:8px}
    .empty-ico,.auth-orb,.pending-orb,.req-icon{filter:saturate(1.1)}

    @media(max-width:820px){
      .auth-panel,.dash-hero{grid-template-columns:1fr}
      .dash-quick{grid-template-columns:repeat(2,1fr);min-width:0}
      .dash-hero-title{font-size:clamp(2.45rem,14vw,4.5rem)}
      .search-hero{max-width:100%}
    }
    @media(max-width:560px){
      .pg{padding:18px 12px 62px}
      .hdr{padding-top:calc(8px + env(safe-area-inset-top,40px));padding-bottom:8px}
      .hdr-title{font-size:.86rem}
      .hdr-sub{font-size:.56rem}
      .theme-toggle{display:none}
      .auth-copy,.auth-action{padding:20px}
      .auth-kpis{grid-template-columns:1fr}
      .dash-quick{grid-template-columns:1fr 1fr}
      .dash-quick-item{min-height:68px;padding:10px}
      .dash-quick-value{font-size:1.25rem}
      .search-box{padding:8px;gap:4px}
      .search-divider{display:none}
      .search-submit{padding:10px 12px}
      .box-card{min-height:148px}
      .tabs{top:52px}
      .form-row{flex-direction:column;gap:0}
      .fld[style]{flex:1!important}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
    }

    /* ══ VIEW AS BANNER ═══════════════════════════════════════════ */
    .vas-banner{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(249,115,22,.08));
      border:1px solid rgba(251,191,36,.35);border-radius:var(--radius);
      padding:11px 15px;margin-bottom:18px;display:flex;align-items:center;gap:10px;
      position:sticky;top:58px;z-index:90;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .vas-banner-icon{font-size:1.1rem;flex-shrink:0}
    .vas-banner-text{flex:1;min-width:0}
    .vas-banner-title{font-size:.78rem;font-weight:800;color:var(--gold)}
    .vas-banner-sub{font-size:.64rem;color:var(--text2);margin-top:1px;font-family:monospace;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vas-exit{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:var(--gold);
      padding:6px 13px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;
      transition:all .15s;white-space:nowrap;flex-shrink:0}
    .vas-exit:hover{background:var(--gold);color:#111827}

    /* ══ VIEW AS SEARCH PANEL ══════════════════════════════════════ */
    .vas-panel{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
    .vas-search-wrap{position:relative;margin-bottom:8px}
    .vas-search-wrap input{width:100%;padding:9px 12px 9px 32px;background:var(--input-bg);
      border:1px solid var(--border);border-radius:9px;font-size:.82rem;color:var(--text);
      outline:none;transition:border-color .2s}
    .vas-search-wrap input:focus{border-color:var(--gold)}
    .vas-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);
      color:var(--text3);font-size:.78rem;pointer-events:none}
    .vas-user-row{display:flex;align-items:center;gap:10px;padding:9px 8px;
      border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:2px}
    .vas-user-row:hover{background:rgba(251,191,36,.1)}
    .vas-user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--accent));
      display:flex;align-items:center;justify-content:center;font-size:.78rem;
      color:#111827;font-weight:700;flex-shrink:0}
    .vas-user-info{flex:1;min-width:0}
    .vas-user-name{font-size:.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vas-user-email{font-size:.63rem;color:var(--text2);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vas-user-role{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:12px;
      background:var(--blue-dim);color:var(--blue);flex-shrink:0}
    .vas-empty{font-size:.75rem;color:var(--text3);text-align:center;padding:14px 0}

    /* ══ VIEW AS HEADER BUTTON & DROPDOWN ════════════════════════ */
    .vas-hdr{position:relative}
    .vas-hdr-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);
      border:1px solid var(--border2);color:var(--text2);padding:6px 9px;border-radius:9px;
      font-size:.72rem;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap;
      min-height:33px;line-height:1}
    .vas-hdr-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,.07)}
    .vas-hdr-btn.vas-active{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.4);
      color:var(--gold);box-shadow:0 0 14px rgba(251,191,36,.18)}
    .vas-hdr-btn.vas-open{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,.07)}
    .vas-hdr-lbl{font-size:.68rem}
    .vas-hdr-chev{font-size:.5rem;opacity:.55;transition:transform .2s}
    .vas-hdr-btn.vas-open .vas-hdr-chev{transform:rotate(180deg)}
    @media(max-width:560px){.vas-hdr-lbl,.vas-hdr-chev{display:none}
      .vas-hdr-btn{padding:6px 8px;min-width:32px;justify-content:center}}
    .vas-hdr-drop{position:fixed;right:10px;top:57px;width:min(320px,calc(100vw - 20px));
      background:var(--card);border:1px solid var(--border2);border-radius:14px;
      box-shadow:0 8px 32px rgba(0,0,0,.45);z-index:400;overflow:hidden;animation:fadeUp .18s ease}
    .vas-hdr-drop-top{display:flex;align-items:center;justify-content:space-between;
      padding:13px 14px 10px;border-bottom:1px solid var(--border)}
    .vas-hdr-drop-title{font-size:.78rem;font-weight:800;color:var(--white);letter-spacing:.2px}
    .vas-hdr-drop-cls{background:none;border:none;color:var(--text3);cursor:pointer;
      font-size:.85rem;padding:3px 6px;border-radius:6px;transition:all .15s;line-height:1}
    .vas-hdr-drop-cls:hover{color:var(--white);background:rgba(255,255,255,.08)}
    .vas-hdr-drop-search{padding:9px 10px;border-bottom:1px solid var(--border);position:relative}
    .vas-hdr-drop-search .vas-search-icon{position:absolute;left:18px;top:50%;
      transform:translateY(-50%);color:var(--text3);font-size:.75rem;pointer-events:none}
    .vas-hdr-drop-input{width:100%;padding:8px 10px 8px 28px;background:var(--input-bg);
      border:1px solid var(--border);border-radius:8px;font-size:.78rem;color:var(--text);
      outline:none;transition:border-color .2s;box-sizing:border-box}
    .vas-hdr-drop-input:focus{border-color:var(--gold)}
    .vas-hdr-list{max-height:min(260px,52vh);overflow-y:auto;padding:6px 6px 8px}

    /* ══ CO-OWNER / VIEW-ONLY BADGE ════════════════════════════════ */
    .box-coowner-badge{display:inline-flex;align-items:center;gap:3px;
      background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.22);
      color:var(--green);font-size:.58rem;font-weight:700;padding:2px 7px;
      border-radius:10px;letter-spacing:.2px;margin-top:4px}
    .box-viewonly-badge{display:inline-flex;align-items:center;gap:3px;
      background:rgba(122,155,181,.07);border:1px solid rgba(122,155,181,.14);
      color:var(--text3);font-size:.58rem;font-weight:700;padding:2px 7px;
      border-radius:10px;letter-spacing:.2px;margin-top:4px}

    /* ══ BOX RECOMMENDATION PANEL ══════════════════════════════════ */
    .rec-panel{background:var(--card2);border:1px solid var(--border);border-radius:10px;
      padding:11px;margin:-4px 0 12px}
    .rec-header{font-size:.6rem;font-weight:700;color:var(--text2);letter-spacing:.8px;
      text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:5px}
    .rec-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;cursor:pointer;
      padding:4px 5px;border-radius:7px;transition:background .15s}
    .rec-item:hover{background:var(--accent-dim)}
    .rec-item:last-child{margin-bottom:0}
    .rec-box-name{flex:1;font-size:.76rem;font-weight:600;color:var(--text);min-width:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rec-bar-wrap{width:55px;height:4px;background:var(--border);border-radius:3px;flex-shrink:0}
    .rec-bar{height:100%;border-radius:3px;transition:width .4s ease}
    .rec-pct{font-size:.68rem;font-weight:700;min-width:30px;text-align:right;flex-shrink:0}
    .rec-note{font-size:.62rem;color:var(--text3);margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
    .rec-current-tag{font-size:.55rem;color:var(--text3);margin-left:4px;font-weight:400}

    /* ══ ADD ITEM PHOTO ZONE ═══════════════════════════════════════ */
    .add-photo-zone{border:2px dashed var(--border2);border-radius:10px;padding:13px 12px;
      margin-bottom:12px;text-align:center;cursor:pointer;transition:all .2s}
    .add-photo-zone:hover{border-color:var(--accent);background:var(--accent-dim)}
    .add-photo-zone-label{font-size:.72rem;font-weight:600;color:var(--text2);margin-top:4px}
    .add-photo-zone-sub{font-size:.62rem;color:var(--text3);margin-top:2px}
    .add-photo-zone-btns{display:flex;gap:8px;justify-content:center;margin-top:9px}
    .add-photo-zone-btn{background:var(--card);border:1px solid var(--border2);color:var(--text2);
      padding:5px 11px;border-radius:7px;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
    .add-photo-zone-btn:hover{border-color:var(--accent);color:var(--accent)}
    .add-photo-preview-wrap{display:none;position:relative;margin-bottom:12px;border-radius:10px;overflow:hidden}
    .add-photo-preview-wrap img{width:100%;max-height:150px;object-fit:cover;display:block}
    .add-photo-remove{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;
      color:#fff;width:24px;height:24px;border-radius:50%;font-size:.75rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;line-height:1}
    .add-photo-status{font-size:.7rem;text-align:center;min-height:14px;margin-bottom:10px}

    /* ══ AUTOFILL FLASH ═════════════════════════════════════════════ */
    @keyframes autofillPop{0%{box-shadow:0 0 0 0 rgba(251,191,36,.6);border-color:var(--gold)}
      60%{box-shadow:0 0 0 5px rgba(251,191,36,.15)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
    .autofill-flash{animation:autofillPop .7s ease!important;border-color:var(--gold)!important}
    /* ══ MOVE MODAL BOX LIST ═════════════════════════════════════════ */
    .move-box-list{max-height:min(250px,52vh);overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
    .move-box-opt{border:2px solid var(--border);border-left:3px solid var(--bca,var(--border2));
      border-radius:9px;padding:9px 12px;cursor:pointer;transition:all .15s;background:var(--card2)}
    .move-box-opt:hover{background:var(--accent-dim);border-color:var(--bca,var(--accent))}
    .move-box-opt.selected{border-color:var(--bca,var(--green))!important;
      background:rgba(45,212,191,.07);border-left-width:4px}
    /* ══ BOX COLOR PICKER ═══════════════════════════════════════════ */
    .box-color-btn{width:18px;height:18px;border-radius:50%;background:var(--bca,var(--accent));
      border:2px solid rgba(255,255,255,.22);cursor:pointer;padding:0;transition:all .18s;
      flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .box-color-btn:hover{transform:scale(1.25);border-color:#fff}
    .color-picker-pop{position:fixed;background:var(--card);border:1px solid var(--border2);
      border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);
      gap:6px;z-index:600;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;
      border:2px solid transparent;transition:all .15s}
    .color-swatch:hover,.color-swatch.on{transform:scale(1.18);border-color:#fff;
      box-shadow:0 0 8px rgba(255,255,255,.3)}
    /* ══ ITEM MOVE RECOMMENDATION CHIP ══════════════════════════════ */
    .move-rec-chip{display:inline-flex;align-items:center;font-size:.62rem;font-weight:700;
      padding:3px 8px;border-radius:10px;border:1px solid;cursor:pointer;
      margin-top:5px;transition:all .15s;opacity:.8;max-width:100%}
    .move-rec-chip:hover{opacity:1!important}
    /* Quick-move popover */
    .qmove-pop{position:fixed;z-index:1200;background:var(--card);border:1px solid var(--border2);
      border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);min-width:230px;max-width:290px}
    .qmove-title{font-size:.72rem;color:var(--text2);margin-bottom:6px}
    .qmove-item{font-weight:800;font-size:.88rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qmove-arrow{display:flex;align-items:center;gap:6px;font-size:.75rem;margin:8px 0 12px}
    .qmove-from{color:var(--text3);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qmove-dest{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qmove-pct{font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0}
    .qmove-btns{display:flex;gap:7px}
    .qmove-confirm{flex:1;background:var(--accent);color:#fff;border:none;border-radius:9px;
      padding:8px 0;font-size:.78rem;font-weight:700;cursor:pointer;transition:background .15s}
    .qmove-confirm:hover{background:#ea6c00}
    .qmove-confirm:disabled{opacity:.5;cursor:not-allowed}
    .qmove-cancel{background:var(--card2);color:var(--text2);border:1px solid var(--border);
      border-radius:9px;padding:8px 12px;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .15s}
    .qmove-cancel:hover{background:var(--border)}
    /* ══ LENDING ═══════════════════════════════════════════════════ */
    .lent-badge{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;font-weight:700;
      padding:3px 8px;border-radius:10px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);
      color:#8b5cf6;margin-top:5px;max-width:100%}
    .item-lend{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#8b5cf6;
      border-radius:8px;padding:5px 9px;font-size:.72rem;font-weight:700;cursor:pointer;
      display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;flex-shrink:0}
    .item-lend:hover{background:rgba(139,92,246,.25);border-color:#8b5cf6}
    .item-return{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#22c55e;
      border-radius:8px;padding:5px 9px;font-size:.72rem;font-weight:700;cursor:pointer;
      display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;flex-shrink:0}
    .item-return:hover{background:rgba(34,197,94,.2);border-color:#22c55e}
    /* Lend modal */
    .lend-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px}
    .lend-modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .lend-modal-title{font-size:1rem;font-weight:800;margin-bottom:4px}
    .lend-modal-sub{font-size:.78rem;color:var(--text2);margin-bottom:20px}
    .lend-modal-actions{display:flex;gap:8px;margin-top:20px}
    /* Lent panel on dashboard */
    .lent-panel{background:var(--card);border:1px solid rgba(139,92,246,.3);border-radius:var(--radius);overflow:hidden;margin-top:8px}
    .lent-panel-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
    .lent-panel-hdr:hover{background:rgba(139,92,246,.06)}
    .lent-panel-title{font-weight:700;font-size:.88rem;flex:1}
    .lent-panel-count{background:#8b5cf6;color:#fff;border-radius:20px;padding:2px 9px;font-size:.72rem;font-weight:800}
    .lent-panel-chev{font-size:.7rem;color:var(--text3);transition:transform .2s}
    .lent-panel-chev.open{transform:rotate(180deg)}
    .lent-panel-body{padding:0 12px 12px}
    .lent-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);font-size:.82rem}
    .lent-row:last-child{border-bottom:none}
    .lent-row-info{flex:1;min-width:0}
    .lent-row-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lent-row-meta{font-size:.72rem;color:var(--text2);margin-top:2px}
    .lent-row-who{display:inline-flex;align-items:center;gap:4px;background:rgba(139,92,246,.12);color:#8b5cf6;border-radius:6px;padding:2px 7px;font-size:.7rem;font-weight:700;margin-top:4px}
    .lent-row-due{font-size:.68rem;color:var(--text3);margin-top:3px}
    .lent-row-due.overdue{color:#dc2626;font-weight:700}
    .overdue-badge{display:inline-flex;align-items:center;gap:4px;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;padding:2px 8px;font-size:.68rem;font-weight:700;margin-top:4px}
    .remind-btn{background:none;border:1px solid var(--text3);color:var(--text2);border-radius:6px;padding:3px 8px;font-size:.67rem;cursor:pointer;white-space:nowrap;transition:all .15s}
    .remind-btn:hover{border-color:#f97316;color:#f97316}
    /* ── Garage Zone ─────────────────────────────────────────────── */
    .garage-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:8px}
    .garage-panel-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
    .garage-panel-hdr:hover{background:var(--hover)}
    .garage-panel-count{background:var(--card2);color:var(--text3);border-radius:20px;padding:2px 9px;font-size:.72rem;font-weight:800}
    .garage-panel-body{padding:0 12px 12px}
    .garage-item-card{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);font-size:.82rem}
    .garage-item-card:last-child{border-bottom:none}
    .garage-item-info{flex:1;min-width:0}
    .garage-item-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .garage-item-meta{font-size:.72rem;color:var(--text2);margin-top:2px}
    .garage-item-loc{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border-radius:5px;padding:1px 6px;font-size:.65rem;font-weight:600;color:var(--text2);margin-top:3px}
    .garage-add-btn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .15s;width:100%;margin-top:8px;justify-content:center}
    .garage-add-btn:hover{border-color:#f97316;color:#f97316}
    /* ══ INVENTORY BAR ═══════════════════════════════════════════════ */
    .inv-bar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px}
    .inv-bar-header{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
    .inv-bar-total{font-size:2rem;font-weight:900;color:var(--text);line-height:1}
    .inv-bar-label{font-size:.75rem;color:var(--text2);flex:1}
    .inv-bar-csv{font-size:.72rem;color:var(--text3);background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;transition:all .15s;flex-shrink:0}
    .inv-bar-csv:hover{border-color:var(--border2);color:var(--text2)}
    .inv-progress{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex;gap:2px;margin-bottom:10px}
    .inv-prog-seg{height:100%;border-radius:2px;transition:width .6s ease}
    .inv-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .inv-legend-item{display:flex;align-items:center;gap:5px}
    .inv-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .inv-legend-label{font-size:.72rem;color:var(--text2)}
    .inv-legend-val{font-size:.72rem;font-weight:800;color:var(--text)}
    /* ══ QUICK INFO ROW (garage + seasonal) ══════════════════════════ */
    .quick-info-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .qi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
    .qi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
    .qi-card.gz::before{background:#10b981}
    .qi-card.seasonal::before{background:#f97316}
    .qi-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
    .qi-card-icon{font-size:1.5rem;flex-shrink:0}
    .qi-card-body{flex:1;min-width:0}
    .qi-card-title{font-size:.83rem;font-weight:800;color:var(--text)}
    .qi-card-sub{font-size:.7rem;color:var(--text2);margin-top:2px}
    .qi-card-arrow{font-size:.9rem;color:var(--text3);flex-shrink:0}
    /* ══ ITEMS SORT BAR ══════════════════════════════════════════════ */
    .items-sort-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;margin-bottom:2px}
    .items-sort-count{font-size:.72rem;color:var(--text3);font-weight:600}
    /* ══ SECTION HEADER ROW ══════════════════════════════════════════ */
    .sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .sec-row .sec{margin-bottom:0}
    .sec-count{font-size:.7rem;font-weight:600;color:var(--text3);margin-left:4px}
    /* ── Sort control */
    .sort-wrap{position:relative}
    .sort-btn{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:.72rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
    .sort-btn:hover{border-color:var(--border2);color:var(--text)}
    .sort-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;z-index:9999;min-width:150px;box-shadow:0 8px 32px rgba(0,0,0,.28)}
